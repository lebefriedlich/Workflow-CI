name: Train and Deploy Model CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-and-package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "mlflow==2.19.0" "scikit-learn<=1.5.2" pandas numpy matplotlib seaborn

    - name: Run MLflow Project Training
      run: |
        cd MLProject
        mlflow run . --env-manager local -P data_dir=heart_disease_preprocessing

    - name: Verify Model Artifacts
      run: |
        ls -la MLProject/mlruns/

    - name: Upload Trained Model Artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-model-artifacts
        path: MLProject/mlruns/

    - name: Log in to Docker Hub
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v2
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image using mlflow build-docker (Advance)
      if: env.DOCKER_USERNAME != ''
      run: |
        # Cari URI model artifact yang baru terbentuk
        MODEL_URI=$(find MLProject/mlruns -name "model" -type d | head -n 1)
        echo "Found Model URI: $MODEL_URI"
        mlflow models build-docker -m "$MODEL_URI" -n "${{ secrets.DOCKER_USERNAME }}/heart-disease-mlflow-model:latest" --env-manager local
        docker push "${{ secrets.DOCKER_USERNAME }}/heart-disease-mlflow-model:latest"
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
